name: Mirae Flow
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/run.mjs
      - run: node tests/telegram.mjs
      - run: cd web && npm ci && npx tsc -b
  website:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd web && npm ci && npm run build
      - run: cd web/dist && zip -r ../../Mirae-Flow-website.zip .
      - uses: actions/upload-artifact@v4
        with: { name: Mirae-Flow-website, path: Mirae-Flow-website.zip }
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  pages:
    needs: website
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd web && npm ci && npm run build
        env: { TARGET: desktop }
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with: { name: Mirae-Flow-Setup, path: 'release/Mirae-Flow-Setup-*.exe', if-no-files-found: error }
  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd web && npm ci && npm run build
        env: { TARGET: desktop }
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Mirae-Flow-Linux
          path: |
            release/Mirae-Flow-*-linux.deb
            release/Mirae-Flow-*-linux.AppImage
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, website]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.deb
            dist/*.AppImage
            dist/*.zip
          generate_release_notes: true
